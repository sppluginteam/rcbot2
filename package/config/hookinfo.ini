# hookinfo for RCbot2 linux
# https://github.com/nosoop/rcbot2

# This config is used to hook against the correct game functions; wrong / outdated data will
# very likely crash your game!

# CDODPlayer::PlayerRunCommand(CUserCmd*, IMoveHelper*)
# this is used to process bots
# TODO replace it with m_pController->RunPlayerMove() from the SDK in the future
runplayermove_dods_win=425
runplayermove_dods_linux=426

# this is used to process bots
# TODO replace it with m_pController->RunPlayerMove() from the SDK in the future
runplayermove_synergy_win=424
runplayermove_synergy_linux=425

# CDODPlayer vtable slots of the weapon owner guard.
# The guard hooks CDODPlayer virtuals that dispatch the active weapon's
# vfunc 0x3fc (0x102a2ab0 in server.dll). That weapon virtual resolves the
# weapon's m_hOwner (weapon+0x49c) and unconditionally writes
# "owner->flag = 0" (owner+0x1428) - when the owner is gone the write goes
# through a null pointer and crashes the server (server.dll+0x2a2ad4).
# The guard clears m_hActiveWeapon before the original runs, so the weapon
# virtual is never dispatched.
#
# The values are vtable SLOT INDEXES (not byte offsets):
#   376 -> 0x5e0 -> 0x101e36d0 : the confirmed crash path (death sequence,
#                                verified with the crash minidump)
#   348 -> 0x570 -> 0x101e1380 : the other death path dispatch of the active
#                                weapon (reached from CDODPlayer::vfunc0x56c)
# Set a slot to 0 to disable that hook.
# The linux slots are unverified (Itanium ABI shifts the slots by one, same as
# runplayermove above) - set them to 0 to disable the guard on linux.
weapon_guard_dods_win=376
weapon_guard_dods_linux=377
weapon_guard_dods_b_win=348
weapon_guard_dods_b_linux=349

# CreateGameRulesObject from sdktools.games
create_gamerules_object_win=\x55\x8B\xEC\x8B\x0D\x2A\x2A\x2A\x2A\x85\xC9\x74\x07

# Offset into CreateGameRulesObject where the address to the gamerules pointer is stored
gamerules_win=5
gamerules_linux=5

# Offset for reading datamaps
getdatadescmap_win=11
getdatadescmap_linux=12